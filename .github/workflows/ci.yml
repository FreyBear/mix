name: CI & Docker

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Kvalitetssjekk og tester
    runs-on: ubuntu-latest

    steps:
      - name: Sjekk ut kode
        uses: actions/checkout@v4

      - name: Sett opp Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Installer avhengigheter
        run: npm ci

      - name: Sjekk kodekvalitet (ESLint)
        run: npm run lint

      - name: Typekontroll (TypeScript)
        run: npm run typecheck

      - name: Kjør automatiske logikk- og autentiseringstester
        run: npm test

      - name: Test produksjonsbygg (Next.js)
        run: npm run build

  docker:
    name: Docker-bygging og publisering
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Sjekk ut kode
        uses: actions/checkout@v4

      - name: Formater image-navn til lowercase
        id: image_name
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${REPO_LOWER}" >> "$GITHUB_OUTPUT"

      - name: Sett opp Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Logg inn på GitHub Container Registry (GHCR)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Bygg og publiser Docker-image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ steps.image_name.outputs.image }}:latest
            ${{ steps.image_name.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
